name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2026-09-17"

# -----------------------------
# KV NAMESPACE (YOUR PROVIDED ID)
# -----------------------------
[[kv_namespaces]]
binding = "planetary-max-1"
id = "ede711e3c9764df481d63dcc5820b7e7"

# -----------------------------
# ENVIRONMENT VARIABLES
# -----------------------------
[vars]
PLANETARY_MODE = "single"
UMBRELLA_ENFORCEMENT = "strict"

[durable_objects]
bindings = [
  { name = "PORTAL_KERNEL", class_name = "PortalKernel" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortalKernel"]

[[services]]
binding = "MAX_OS_1"
service = "max-os-1"

# -----------------------------
# BUILD CONFIG
# -----------------------------
[build]
command = "npm run build"
