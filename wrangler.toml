name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2026-09-17"

# Phase-19 Bindings
# MAXOS_STATE now uses KV (not R2)
[[kv_namespaces]]
binding = "MAXOS_STATE"
id = "planetary-max-1"

# Environment Variables
[vars]
PLANETARY_MODE = "single"
UMBRELLA_ENFORCEMENT = "strict"

# Durable Objects
[[durable_objects.bindings]]
name = "PORTAL_KERNEL"
class_name = "PortalKernel"

# Migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortalKernel"]

# Build
[build]
command = "npm run build"
